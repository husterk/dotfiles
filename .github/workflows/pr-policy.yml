name: PR policy

# Every change starts from an issue (see CLAUDE.md). This check fails a pull
# request whose body does not close an open issue, so the issue's acceptance
# criteria are always there to verify against. Bot PRs are exempt.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - uses: husterk/.github/actions/linked-issue@34a93e0269113266af4aeeaf1f0a82c2eb55dc55 # v2.1.2
