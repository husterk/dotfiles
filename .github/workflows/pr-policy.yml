name: PR policy

# Every change starts from an issue (see CLAUDE.md). This check fails a pull
# request whose body does not close an open issue, so the issue's acceptance
# criteria are always there to verify against. Bot PRs are exempt.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - uses: husterk/.github/actions/linked-issue@a8ef4b6f2f04c290864e64982019b55e2f8bb267 # v1.0.0
