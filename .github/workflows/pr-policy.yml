name: PR policy

# Every change starts from an issue (see CLAUDE.md). This check fails a pull
# request whose body does not close an open issue, so the issue's acceptance
# criteria are always there to verify against. Bot PRs are exempt.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  linked-issue:
    name: Linked issue
    runs-on: ubuntu-latest
    steps:
      - uses: husterk/.github/actions/linked-issue@9648b8bcbc3386eb20ef683d4da442e5c1c47f8b # v1.3.0
