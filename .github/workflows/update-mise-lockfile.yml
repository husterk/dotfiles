name: Update mise Lockfile

# Update mise Lockfile Workflow
# -----------------------------
#
# This workflow automatically runs `mise lock` to update the mise.lock file
# whenever Renovate updates tool versions in mise.toml. It commits the
# updated lockfile back to the Renovate PR branch.
#
# Trigger:
# - Runs on pushes to branches matching the Renovate branch prefix
#   that modify mise.toml
#
# Required Permissions:
# - contents: write (to push the updated lockfile back to the branch)
# - actions: write (to dispatch CI on the pushed commit)
#
# Important Notes:
# - Only runs when mise.toml is modified on a Renovate branch
# - Skips execution if mise.lock is already up to date
# - Uses the github-actions[bot] identity for commits, which are unsigned:
#   merge Renovate PRs with squash so GitHub signs the result
# - A push made with GITHUB_TOKEN starts no workflow runs, so the last step
#   dispatches CI and the PR policy check on the new head commit. No loop risk: the dispatched run is
#   CI, and this workflow only triggers on mise.toml pushes.

permissions:
  contents: write
  actions: write

on:
  push:
    branches:
      - "renovate/**"
    paths:
      - "mise.toml"

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-lockfile:
    name: Update mise.lock
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.ref }}

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Update mise lockfile
        run: mise lock

      - name: Commit and push if changed
        id: commit
        run: |
          if git diff --quiet mise.lock; then
            echo "mise.lock is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add mise.lock
          git commit -m "chore: update mise.lock"
          git push
          echo "pushed=true" >> "$GITHUB_OUTPUT"

      # Pushes made with GITHUB_TOKEN start no workflow runs, but a
      # workflow_dispatch always does, so run every required check on the
      # new head commit.
      - name: Run required checks on the lockfile commit
        if: steps.commit.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$GITHUB_REF_NAME"
          gh workflow run pr-policy.yml --ref "$GITHUB_REF_NAME"
