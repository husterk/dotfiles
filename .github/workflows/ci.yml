name: CI

# Continuous Integration
# ---------------------
#
# Runs the same quality gates as `mise run check` locally, so that pull
# requests - especially Renovate's, which no human formats - cannot land code
# that fails them.
#
# Scope: `tools` and `quality` validate the repo's sources. `build` builds each
# host's nix-darwin system from the root flake. The flake's `private` input
# defaults to the tracked stub under nix/private-stub, so the build needs no
# secrets and no private repository access.
#
# Two jobs rather than one: `tools` needs only mise and reports in seconds,
# while `quality` additionally installs Nix (nixfmt, statix and treefmt come
# from nixpkgs via modules/dev-tools.nix, not from mise). Splitting them means
# a bad lockfile fails fast instead of waiting on a Nix install.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tools:
    name: Tool pins and manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      # Verifies every checksum in mise.lock for the platforms this runner
      # needs - the Linux entries a macOS-only workflow never exercises. This
      # is the check that would have caught the `op` platform entries that
      # pointed linux-x64, macos-x64 and windows-x64 at the macOS arm64 zip.
      - name: Install pinned tools (verifies lockfile checksums)
        run: mise install --locked

      - name: mise configs and lockfiles agree
        run: mise run dev:check-tool-pins

      - name: Validate host manifests
        run: mise run dev:validate-all-hosts

  quality:
    name: Format and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install pinned tools
        run: mise install --locked

      # nixfmt, statix and treefmt are declared in modules/dev-tools.nix and
      # come from nixpkgs, not mise, so CI needs a Nix to run the same checks
      # `mise run check` runs locally.
      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Pinned to the same nixpkgs revision the host builds from, so CI runs
      # byte-identical nixfmt/statix/treefmt to `mise run check`. A
      # bare `nixpkgs#treefmt` would resolve via the runner's flake registry
      # and could format differently than your machine does - the same version
      # skew that makes formatter bumps churn.
      - name: Install Nix-provided formatters
        run: |
          rev="$(jq -r '.nodes.nixpkgs.locked.rev' flake.lock)"
          echo "Using nixpkgs $rev (from flake.lock)"
          nix profile install \
            "github:NixOS/nixpkgs/$rev#treefmt" \
            "github:NixOS/nixpkgs/$rev#nixfmt" \
            "github:NixOS/nixpkgs/$rev#statix"

      # treefmt --ci implies --no-cache and --fail-on-change. This is the check
      # that would have caught shfmt 3.14.0 reformatting a file the Renovate
      # PR bumping it did not touch.
      - name: Formatting is clean
        run: mise run dev:format-check

      # shellcheck, statix, the mise/Nix tool-sync check, the US spelling
      # scanner, and the Claude skill/agent audit. The sync check no-ops here:
      # it exits 0 when /run/current-system/sw/bin is absent, so it stays a
      # nix-darwin-only gate. The last two need python3, which the runner has.
      - name: Lint
        run: mise run dev:lint

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          install: false

      - name: Install pinned tools
        run: mise install --locked

      # envsubst renders the dotfile templates and stow deploys them in the
      # round-trip tests.
      - name: Install envsubst and stow
        run: sudo apt-get install -y --no-install-recommends gettext-base stow

      - name: Run tests
        run: mise run dev:test

  build:
    name: Build nix-darwin systems
    # macOS minutes cost 10x on private repos. While private, build only on
    # pushes to main or on a PR labeled `build`. A skipped job counts as
    # passing for required checks.
    if: >-
      !github.event.repository.private
      || github.event_name == 'push'
      || contains(github.event.pull_request.labels.*.name, 'build')
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # Builds with the public stub for the `private` input. No override, so
      # the result is what a fresh clone of this repo produces.
      - name: Build every host
        run: |
          for host in $(nix eval --json .#darwinConfigurations --apply builtins.attrNames | jq -r '.[]'); do
            echo "Building $host"
            nix build --no-link --print-build-logs ".#darwinConfigurations.$host.system"
          done
