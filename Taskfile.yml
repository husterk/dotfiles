version: "3"
# ========================================================================
# Dotfiles Task Runner
# ========================================================================
# Modern task-based workflow for managing dotfiles and nix-darwin configuration
#
# Usage: task [command]
#
# Override hostname: task HOSTNAME=my-host [command]
# ========================================================================
vars:
  # Hostname detection with fallback and override support
  HOSTNAME:
    sh: echo "${HOSTNAME:-$(hostname -s)}"
  # Repository root
  REPO_ROOT:
    sh: git rev-parse --show-toplevel 2>/dev/null || pwd
  # Bootstrap target from host manifest
  BOOTSTRAP_TARGET:
    sh: |
      if [ -f "{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}/host-manifest.yml" ]; then
        if command -v yq &> /dev/null; then
          yq eval '.config.bootstrap-target // "macos-arm64"' "{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}/host-manifest.yml" 2>/dev/null || echo "macos-arm64"
        else
          awk '/^config:/,/^[^ ]/ {if ($1 == "bootstrap-target:") print $2}' "{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}/host-manifest.yml" | tr -d '\r' || echo "macos-arm64"
        fi
      else
        echo "macos-arm64"
      fi
  # Host directory
  HOST_DIR: '{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}'
  # Bootstrap scripts directory
  BOOTSTRAP_SCRIPTS_DIR: '{{.REPO_ROOT}}/bootstrap-scripts/{{.BOOTSTRAP_TARGET}}'
# Include task files for better organization
includes:
  dev: ./tasks/tasks-dev.yml
  env: ./tasks/tasks-env.yml
  nix: ./tasks/tasks-nix.yml
  dotfiles: ./tasks/tasks-dotfiles.yml
tasks:
  # Default task - show help
  default:
    desc: Show available tasks and current configuration
    silent: true
    cmds:
      - '{{.ROOT_DIR}}/tasks/scripts/tasks-main-show-default.sh {{.HOSTNAME}} {{.BOOTSTRAP_TARGET}} {{.HOST_DIR}}'
  # Status check
  show-status:
    desc: Show current configuration status
    silent: true
    preconditions:
      - sh: '[ -d "{{.HOST_DIR}}" ]'
        msg: 'Host directory not found: {{.HOST_DIR}}'
      - sh: '[ -f "{{.HOST_DIR}}/host-manifest.yml" ]'
        msg: 'Host manifest not found: {{.HOST_DIR}}/host-manifest.yml'
    cmds:
      - '{{.ROOT_DIR}}/tasks/scripts/tasks-main-show-status.sh {{.HOSTNAME}} {{.BOOTSTRAP_TARGET}} {{.HOST_DIR}}'
  # Set up new host for nix and dotfiles
  set-up-new-host:
    desc: Complete set up steps after bootstrap (generate + apply-nix-config + deploy-dotfiles)
    silent: true
    summary: |
      Runs the complete setup workflow after bootstrapping:
      1. Generate .env from 1Password
      2. Generate Nix configuration
      3. Generate dotfiles
      4. Apply Nix configuration
      5. Deploy dotfiles

      IMPORTANT: On a fresh machine, run the bootstrap script FIRST:
        ./bootstrap-scripts/macos-arm64/bootstrap.sh <hostname>

      This installs Nix and nix-darwin. After that, restart your shell
      and run this task.
    deps:
      - show-status
    cmds:
      - task: generate-all
      - task: nix:apply
      - task: dotfiles:deploy
  # Refresh existing host nix and dotfiles configuration
  refresh-host:
    desc: Regenerate and redeploy everything (no bootstrap)
    silent: true
    summary: |
      Regenerates Nix configuration and dotfiles, then redeploys them:
      1. Generate Nix configuration
      2. Generate dotfiles
      3. Apply Nix configuration
      4. Deploy dotfiles

      Use this after making changes to templates or manifests.
    deps:
      - show-status
    cmds:
      - task: nix:generate
      - task: dotfiles:generate
      - task: nix:apply
      - task: dotfiles:deploy
  # Generate all configuration files
  generate-all:
    desc: Generate all configuration files (env + nix + dotfiles)
    silent: true
    summary: |
      Convenience task to generate all configuration files:
      1. .env from 1Password
      2. configuration.nix from template
      3. dotfiles from templates
    cmds:
      - task: env:generate
      - task: nix:generate
      - task: dotfiles:generate
      - echo "✅ All configurations generated successfully"
  # Unbootstrap an existing host (remove nix-darwin and Nix)
  unbootstrap:
    desc: Remove Nix and nix-darwin from system
    silent: true
    summary: |
      Completely removes Nix and nix-darwin from the system.

      ⚠️  WARNING: This is destructive!

      This will:
      - Remove all Nix-installed packages
      - Remove nix-darwin
      - Remove Nix package manager
      - Clean up system modifications

      Make sure to restore dotfiles first if needed.
    dir: '{{.REPO_ROOT}}'
    prompt: |
      ⚠️  WARNING: This will completely remove Nix and nix-darwin!

      This is a destructive operation. All Nix-installed packages will be removed.

      Have you restored your dotfiles? (task dotfiles:restore)

      Are you absolutely sure you want to continue?
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-main-unbootstrap.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}}'
