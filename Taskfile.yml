version: "3"
# ========================================================================
# Dotfiles Task Runner
# ========================================================================
# Modern task-based workflow for managing dotfiles and nix-darwin configuration
#
# Usage: task [command]
#
# Override hostname: task HOSTNAME=my-host [command]
# ========================================================================
vars:
  # Hostname detection with fallback and override support
  HOSTNAME:
    sh: echo "${HOSTNAME:-$(hostname -s)}"
  # Repository root
  REPO_ROOT:
    sh: git rev-parse --show-toplevel 2>/dev/null || pwd
  # Bootstrap target from host manifest
  BOOTSTRAP_TARGET:
    sh: |
      if [ -f "{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}/host-manifest.yml" ]; then
        if command -v yq &> /dev/null; then
          yq eval '.config.bootstrap-target // "macos-arm64"' "{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}/host-manifest.yml" 2>/dev/null || echo "macos-arm64"
        else
          awk '/^config:/,/^[^ ]/ {if ($1 == "bootstrap-target:") print $2}' "{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}/host-manifest.yml" | tr -d '\r' || echo "macos-arm64"
        fi
      else
        echo "macos-arm64"
      fi
  # Host directory
  HOST_DIR: '{{.REPO_ROOT}}/hosts/{{.HOSTNAME}}'
  # Bootstrap scripts directory
  BOOTSTRAP_SCRIPTS_DIR: '{{.REPO_ROOT}}/bootstrap-scripts/{{.BOOTSTRAP_TARGET}}'
# Include task files for better organization
includes:
  bootstrap: ./tasks/Taskfile.bootstrap.yml
  dotfiles: ./tasks/Taskfile.dotfiles.yml
  dev: ./tasks/Taskfile.dev.yml
# Default task - show help
tasks:
  default:
    desc: Show available tasks and current configuration
    silent: true
    cmds:
      - '{{.ROOT_DIR}}/tasks/scripts/show-default.sh {{.HOSTNAME}} {{.BOOTSTRAP_TARGET}} {{.HOST_DIR}}'
  # Status check
  check-status:
    desc: Show current configuration status
    silent: true
    preconditions:
      - sh: '[ -d "{{.HOST_DIR}}" ]'
        msg: 'Host directory not found: {{.HOST_DIR}}'
      - sh: '[ -f "{{.HOST_DIR}}/host-manifest.yml" ]'
        msg: 'Host manifest not found: {{.HOST_DIR}}/host-manifest.yml'
    cmds:
      - '{{.ROOT_DIR}}/tasks/scripts/show-status.sh {{.HOSTNAME}} {{.BOOTSTRAP_TARGET}} {{.HOST_DIR}}'
  # Quick workflow commands
  setup-host:
    desc: Complete setup after bootstrap (generate + deploy-nix + deploy-dotfiles)
    silent: true
    summary: |
      Runs the complete setup workflow after bootstrapping:
      1. Generate .env from 1Password
      2. Generate Nix configuration
      3. Generate dotfiles
      4. Deploy nix configuration
      5. Deploy dotfiles

      IMPORTANT: On a fresh machine, run the bootstrap script FIRST:
        ./bootstrap-scripts/macos-arm64/bootstrap.sh <hostname>

      This installs Nix and nix-darwin. After that, restart your shell
      and run this task.
    deps:
      - check-status
    cmds:
      - task: bootstrap:generate-all
      - task: bootstrap:apply-config
      - task: dotfiles:deploy
  refresh-host:
    desc: Regenerate and redeploy everything (no bootstrap)
    silent: true
    summary: |
      Regenerates Nix configuration and dotfiles, then redeploys them:
      1. Generate Nix configuration
      2. Generate dotfiles
      3. Deploy Nix configuration
      4. Deploy dotfiles

      Use this after making changes to templates or manifests.
    deps:
      - check-status
    cmds:
      - task: bootstrap:generate-nix-config
      - task: bootstrap:generate-dotfiles
      - task: bootstrap:apply-config
      - task: dotfiles:deploy
  # Convenience aliases for common tasks
  generate-all:
    desc: Generate all configurations (env + nix + dotfiles)
    silent: true
    summary: |
      Generates all configuration files from templates:
      - .env from 1Password secrets
      - configuration.nix from template
      - dotfiles from templates

      This does not apply or deploy anything, just generates files.
    cmds:
      - task: bootstrap:generate-all
  deploy-nix:
    desc: Deploy Nix configuration to system
    silent: true
    summary: |
      Applies the generated Nix configuration using darwin-rebuild.
      This will:
      - Install/update packages
      - Apply system settings
      - Restart services if needed

      Requires sudo password.
    cmds:
      - task: bootstrap:apply-config
  deploy-dotfiles:
    desc: Deploy dotfiles using GNU Stow
    silent: true
    summary: |
      Deploys dotfiles to home directory using GNU Stow.
      Creates symlinks from generated dotfiles to their target locations.
    cmds:
      - task: dotfiles:deploy
  capture-dotfiles:
    desc: Capture dotfiles back to source (with --dry-run option)
    silent: true
    summary: |
      Captures changes from deployed dotfiles back to source templates.
      Use --dry-run to preview changes before applying.

      Usage:
        task capture-dotfiles           # Actually capture changes
        task capture-dotfiles -- --dry-run  # Preview changes only
    cmds:
      - task: dotfiles:capture
  watch-dotfiles:
    desc: Watch dotfiles and auto-capture changes
    silent: true
    summary: |
      Watches for changes in deployed dotfiles and automatically
      captures them back to source templates.

      Useful during development when actively editing dotfiles.
    cmds:
      - task: dev:watch-dotfiles
  clean-all:
    desc: Clean generated files
    silent: true
    summary: |
      Removes generated files for the current host:
      - .env
      - configuration.nix
      - dotfiles/

      Use with caution! This will remove secrets from .env.
    cmds:
      - task: dev:clean
