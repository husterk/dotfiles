# treefmt.toml configuration
# This file should stay in sync with your .editorconfig settings

# Global excludes
[global]
excludes = [
  "**/.git/**",
  "**/flake.lock",
  "**/.gitignore",
  "**/.editorconfig",
  "**/*.tmTheme",
  "**/*.nu",            # Nushell is not POSIX/Zsh compatible
  "**/commit-template",
  "**/ignore",
  "**/*.env*",
  "**/*.template",
]

[formatter.nixftm-rfc-style]
command = "nixfmt"
includes = ["*.nix"]

[formatter.nix-conf]
command = "shfmt"
includes = ["**/nix.conf"]
# shfmt for nix.conf files with 2-space indent
options = ["-i", "2", "-w"]

[formatter.shell]
command = "shfmt"
includes = ["*.sh", "**/.zshrc", "**/.zshenv", "**/.zprofile", "**/.envrc", "**/*rc"]
# shfmt with 2-space indent, simplify redirects, and consistent indentation
options = ["-ln", "bash", "-i", "2", "-sr", "-ci", "-w"]

[formatter.lua]
command = "stylua"
includes = ["*.lua"]
# Stylua options to match .editorconfig settings
options = [
  "--indent-type",
  "Spaces",
  "--indent-width",
  "2",
  "--quote-style",
  "AutoPreferDouble",
  "--column-width",
  "120",
]

[formatter.toml]
command = "taplo"
includes = ["*.toml", "**/config"]
# Taplo options to match .editorconfig settings
options = ["fmt", "-o", "indent_string=  ", "-o", "column_width=120", "-o", "reorder_keys=true"]

[formatter.prettier]
command = "prettier"
includes = ["*.md", "*.json", "*.yaml", "*.yml"]
# Prettier reads .editorconfig for settings
options = ["--write"]
