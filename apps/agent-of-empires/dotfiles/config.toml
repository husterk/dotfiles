# agent-of-empires global config
# Schema: https://www.agent-of-empires.com/docs/guides/configuration/

[theme]
name = "empire"

[session]
default_tool = "claude"
# New sessions start in Claude auto mode. YOLO launches claude with
# --dangerously-skip-permissions, which settings.base.json disables anyway.
yolo_mode_default = false

[worktree]
auto_cleanup = true
enabled = true
path_template = "../{repo-name}-worktrees/{branch}"

[tmux]
clipboard = "auto"
mouse = "auto"
status_bar = "auto"

[updates]
# Replaces the old auto_update/check_enabled pair (removed in aoe's config
# schema). "notify" == the previous check_enabled = true + auto_update = false:
# check for releases and report, never install on its own. Homebrew owns the
# actual upgrade.
update_check_mode = "notify"
