---
config:
  root-relative-path: ../../
  home-dir: ${PATH_USERS}/${USER_USERNAME}
  bootstrap-target: macos-arm64

system:
  modules:
    - /modules/macos-base.nix

apps:
  - name: 1password
    modules:
      - /apps/1password/1password.nix
    dotfiles:
      - source: /apps/1password/agent.toml
        target: ~/.config/1Password/ssh/agent.toml


  - name: curl
    modules:
      - /apps/curl/curl.nix
    dotfiles:
      - source: /apps/curl/.curlrc
        target: ~/.config/curl/.curlrc

  - name: davinci-resolve
    modules:
      - /apps/davinci-resolve/davinci-resolve.nix

  - name: dockutil
    modules:
      - /apps/dockutil/dockutil.nix

  - name: dropbox
    modules:
      - /apps/dropbox/dropbox.nix

  - name: git
    modules:
      - /apps/git/git.nix
    dotfiles:
      - source: /apps/git/commit-template
        target: ~/.config/git/commit-template
      - source: /apps/git/config
        target: ~/.config/git/config
      - source: /apps/git/ignore
        target: ~/.config/git/ignore

  - name: homebrew
    modules:
      - /apps/homebrew/homebrew.nix

  - name: image-plus-tools
    modules:
      - /apps/image-plus-tools/image-plus-tools.nix

  - name: inetutils
    modules:
      - /apps/inetutils/inetutils.nix

  - name: mas
    modules:
      - /apps/mas/mas.nix

  - name: nix
    modules:
      - /apps/nix/nix.nix
    dotfiles:
      - source: /apps/nix/nix.conf
        target: ~/.config/nix/nix.conf

  - name: nss
    modules:
      - /apps/nss/nss.nix

  - name: nushell
    modules:
      - /apps/nushell/nushell.nix
    dotfiles:
      - source: /apps/nushell/config.nu
        target: ~/.config/nushell/config.nu
      - source: /apps/nushell/env.nu
        target: ~/.config/nushell/env.nu

  - name: orbstack
    modules:
      - /apps/orbstack/orbstack.nix
    dotfiles:
      - source: /apps/orbstack/docker/config.json
        target: ~/.config/docker/config.json
      - source: /apps/orbstack/docker/daemon.json
        target: ~/.config/docker/daemon.json

  - name: stow
    modules:
      - /apps/stow/stow.nix

  - name: swaks
    modules:
      - /apps/swaks/swaks.nix


  - name: visual-studio-code
    modules:
      - /apps/visual-studio-code/visual-studio-code.nix

  - name: wezterm
    modules:
      - /apps/wezterm/wezterm.nix
    dotfiles:
      - source: /apps/wezterm/wezterm.lua
        target: ~/.config/wezterm/wezterm.lua

  - name: wget
    modules:
      - /apps/wget/wget.nix
    dotfiles:
      - source: /apps/wget/wgetrc
        target: ~/.config/wget/wgetrc

  - name: xcode
    modules:
      - /apps/xcode/xcode.nix

  - name: zsh
    modules:
      - /apps/zsh/zsh.nix
    dotfiles:
      - source: /apps/zsh/.iterm2_shell_integration.zsh
        target: ~/.config/zsh/.iterm2_shell_integration.zsh
      - source: /apps/zsh/.zprofile
        target: ~/.config/zsh/.zprofile
      - source: /apps/zsh/.zshenv
        target: ~/.config/zsh/.zshenv
      - source: /apps/zsh/.zshrc
        target: ~/.config/zsh/.zshrc
