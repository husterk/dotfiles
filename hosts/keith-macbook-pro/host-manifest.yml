---
config:
  root-relative-path: ../../
  home-dir: ${PATH_USERS}/${USER_USERNAME}
  bootstrap-target: macos-arm64

system:
  modules:
    - /modules/macos-base.nix

apps:
  - name: 1password
    modules:
      - /apps/1password/1password.nix
    dotfiles:
      - source: /apps/1password/agent.toml
        target: ~/.config/1Password/ssh/agent.toml

  - name: curl
    modules:
      - /apps/curl/curl.nix
    dotfiles:
      - source: /apps/curl/.curlrc
        target: ~/.config/curl/.curlrc

  - name: git
    modules:
      - /apps/git/git.nix
    dotfiles:
      - source: /apps/git/commit-template
        target: ~/.config/git/commit-template
      - source: /apps/git/config
        target: ~/.config/git/config
      - source: /apps/git/ignore
        target: ~/.config/git/ignore

  - name: nix
    modules:
      - /apps/nix/nix.nix
    dotfiles:
      - source: /apps/nix/nix.conf
        target: ~/.config/nix/nix.conf

  - name: stow
    modules:
      - /apps/stow/stow.nix

  - name: zsh
    modules:
      - /apps/zsh/zsh.nix
    dotfiles:
      - source: /apps/zsh/.iterm2_shell_integration.zsh
        target: ~/.config/zsh/.iterm2_shell_integration.zsh
      - source: /apps/zsh/.zprofile
        target: ~/.config/zsh/.zprofile
      - source: /apps/zsh/.zshenv
        target: ~/.config/zsh/.zshenv
      - source: /apps/zsh/.zshrc
        target: ~/.config/zsh/.zshrc
