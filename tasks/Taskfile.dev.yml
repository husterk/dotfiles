version: "3"

# ========================================================================
# Development Tasks
# ========================================================================
# Tasks for development workflow and maintenance
# ========================================================================

tasks:
  # Watch for dotfile changes and auto-capture
  watch-dotfiles:
    desc: "Watch dotfiles and auto-capture changes back to source"
    silent: true
    summary: |
      Watches for changes in deployed dotfiles and automatically
      captures them back to source templates.

      This is useful during active development when you're frequently
      editing dotfiles in your home directory.

      Press Ctrl+C to stop watching.
    dir: "{{.REPO_ROOT}}"
    interactive: true
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/watch-dotfiles.sh"

  # Watch for template changes and auto-regenerate
  watch-templates:
    desc: "Watch templates and auto-regenerate dotfiles"
    silent: true
    summary: |
      Watches for changes in dotfile templates and automatically
      regenerates dotfiles when templates change.

      This is useful when developing templates and want to see
      changes immediately.

      Press Ctrl+C to stop watching.
    dir: "{{.REPO_ROOT}}"
    interactive: true
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/watch-templates.sh {{.REPO_ROOT}}"

  # Clean generated files
  clean:
    desc: "Clean generated files for current host"
    silent: true
    summary: |
      Removes generated files:
      - .env (contains secrets!)
      - configuration.nix
      - dotfiles/

      Backups are preserved.

      ⚠️  Use with caution! This removes secrets from .env.
    dir: "{{.REPO_ROOT}}"
    prompt: |
      ⚠️  This will delete generated files including .env (which contains secrets).

      Files to be deleted:
      - {{.HOST_DIR}}/generated/.env
      - {{.HOST_DIR}}/generated/configuration.nix
      - {{.HOST_DIR}}/generated/dotfiles/

      Backups will be preserved.

      Continue?
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/clean-generated.sh {{.HOST_DIR}}"

  # Clean all backups
  clean-backups:
    desc: "Remove all dotfile backups for current host"
    silent: true
    summary: |
      Removes all dotfile backup directories.

      This can free up disk space if you have many old backups.

      ⚠️  This cannot be undone!
    dir: "{{.REPO_ROOT}}"
    prompt: |
      ⚠️  This will delete ALL dotfile backups!

      This cannot be undone.

      Continue?
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/clean-backups.sh {{.HOST_DIR}}"

  # List available hosts
  list-hosts:
    desc: "List all available hosts"
    silent: true
    summary: |
      Shows all configured hosts in the repository.
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/list-hosts.sh {{.REPO_ROOT}} {{.HOSTNAME}}"

  # Validate configuration
  validate:
    desc: "Validate host configuration and manifests"
    silent: true
    summary: |
      Validates host configuration files:
      - Checks YAML syntax in host-manifest.yml
      - Validates template.env exists
      - Checks for required files
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/validate-config.sh {{.HOST_DIR}} {{.HOSTNAME}}"

  # Show current environment
  env:
    desc: "Show current environment variables"
    silent: true
    summary: |
      Displays current environment configuration:
      - Hostname
      - Bootstrap target
      - Repository root
      - Environment variables from .env
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/show-env.sh {{.HOST_DIR}} {{.HOSTNAME}} {{.BOOTSTRAP_TARGET}} {{.REPO_ROOT}}"

  # Lint all code
  lint:
    desc: "Lint all code (shell scripts + Nix files)"
    silent: true
    summary: |
      Runs all linters on the repository:
      - shellcheck on shell scripts
      - statix on Nix files
    dir: "{{.REPO_ROOT}}"
    cmds:
      - task: lint-scripts
      - task: lint-nix

  # Lint shell scripts
  lint-scripts:
    desc: "Lint shell scripts with shellcheck"
    silent: true
    summary: |
      Runs shellcheck on all shell scripts in the repository.
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/lint-scripts.sh {{.REPO_ROOT}}"

  # Format all code
  format:
    desc: "Format all code (shell scripts + Nix files)"
    silent: true
    summary: |
      Runs all formatters on the repository:
      - shfmt on shell scripts
      - nixpkgs-fmt on Nix files
    dir: "{{.REPO_ROOT}}"
    cmds:
      - task: format-scripts
      - task: format-nix

  # Format shell scripts
  format-scripts:
    desc: "Format shell scripts with shfmt"
    silent: true
    summary: |
      Formats all shell scripts in the repository using shfmt.
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/format-scripts.sh {{.REPO_ROOT}}"

  # Lint Nix files
  lint-nix:
    desc: "Lint Nix files with statix"
    silent: true
    summary: |
      Runs statix static analysis on all Nix files in the repository.
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/lint-nix.sh {{.REPO_ROOT}}"

  # Format Nix files
  format-nix:
    desc: "Format Nix files with nixpkgs-fmt"
    silent: true
    summary: |
      Formats all Nix files in the repository using nixpkgs-fmt.
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/format-nix.sh {{.REPO_ROOT}}"
