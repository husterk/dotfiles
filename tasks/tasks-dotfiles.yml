version: "3"
# ========================================================================
# Dotfiles Management Tasks
# ========================================================================
# Tasks for deploying, capturing, and managing dotfiles
# ========================================================================
tasks:
  # Generate dotfiles
  generate:
    desc: Generate dotfiles from templates
    silent: true
    summary: |
      Generates dotfiles from app templates with secrets substitution.
      Requires .env file to exist (run env:generate first).

      This should be run:
      - When setting up a new host
      - After modifying dotfile templates
      - After modifying host-manifest.yml
    dir: "{{.REPO_ROOT}}"
    preconditions:
      - sh: '[ -f "{{.HOST_DIR}}/generated/.env" ]'
        msg: ".env not found. Run: task env:generate"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-generate.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}} {{.HOST_DIR}}"
    sources:
      - "{{.HOST_DIR}}/host-manifest.yml"
      - "{{.HOST_DIR}}/generated/.env"
      - apps/**/dotfiles/**/*
    generates:
      - "{{.HOST_DIR}}/generated/dotfiles/**/*"
  # Deploy dotfiles
  deploy:
    desc: Deploy dotfiles using GNU Stow
    silent: true
    summary: |
      Deploys dotfiles to home directory using GNU Stow.
      Creates symlinks from generated dotfiles to their target locations.

      This should be run:
      - After generating dotfiles
      - After applying Nix configuration (which installs Stow)
      - On the host machine

      Dotfiles are backed up automatically before deployment.
    dir: "{{.REPO_ROOT}}"
    preconditions:
      - sh: command -v stow &> /dev/null
        msg: "GNU Stow not found. Run: task nix:apply"
      - sh: '[ -d "{{.HOST_DIR}}/generated/dotfiles" ]'
        msg: "Dotfiles not found. Run: task dotfiles:generate"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-deploy.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}}"
  # Redeploy dotfiles (unstow + stow)
  redeploy:
    desc: Redeploy dotfiles (remove and reinstall symlinks)
    silent: true
    summary: |
      Removes existing dotfile symlinks and redeploys them.

      Use this when:
      - Dotfiles were regenerated
      - You want to refresh all symlinks
      - Symlinks may be in an inconsistent state
    dir: "{{.REPO_ROOT}}"
    preconditions:
      - sh: command -v stow &> /dev/null
        msg: "GNU Stow not found. Run: task nix:apply"
      - sh: '[ -d "{{.HOST_DIR}}/generated/dotfiles" ]'
        msg: "Dotfiles not found. Run: task dotfiles:generate"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-redeploy.sh {{.HOST_DIR}}"
  # Capture dotfiles back to source
  capture:
    desc: Capture dotfiles back to source templates
    silent: true
    summary: |
      Captures changes from deployed dotfiles back to source templates.
      Replaces secrets with template variables.

      This should be run:
      - After editing dotfiles in your home directory
      - With --dry-run first to preview changes

      Usage:
        task dotfiles:capture              # Actually capture
        task dotfiles:capture -- --dry-run # Preview only
    dir: "{{.REPO_ROOT}}"
    preconditions:
      - sh: '[ -d "{{.HOST_DIR}}/generated/dotfiles" ]'
        msg: "Dotfiles not found. Run: task dotfiles:generate"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-capture.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}} {{.CLI_ARGS}}"
  # Restore dotfiles from backup
  restore:
    desc: Restore dotfiles from backup
    silent: true
    summary: |
      Restores dotfiles from the most recent backup.
      Removes Stow symlinks and restores original files.

      Use this:
      - Before unbootstrapping
      - If you want to revert to pre-Stow state
      - If dotfiles are in a broken state
    dir: "{{.REPO_ROOT}}"
    prompt: |
      ⚠️  This will restore dotfiles from backup and remove symlinks.

      Your current symlinked dotfiles will be replaced with backup copies.

      Continue?
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-restore.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}}"
  # Show dotfile status
  status:
    desc: Show dotfile deployment status
    silent: true
    summary: |
      Shows information about deployed dotfiles:
      - Which files are symlinked
      - Backup status
      - Stow package info
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-status.sh {{.HOST_DIR}}"
  # Diff dotfiles
  diff:
    desc: Show differences between source and deployed dotfiles
    silent: true
    summary: |
      Compares source dotfiles with currently deployed versions.
      Useful for seeing what changes you've made.
      Respects .gitignore files in app dotfiles directories.
    dir: "{{.REPO_ROOT}}"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-diff.sh {{.HOST_DIR}} {{.REPO_ROOT}}"
  # Watch for dotfile changes on the host and auto-capture
  watch-host:
    desc: Watch dotfiles on the host and auto-capture changes back to source
    silent: true
    summary: |
      Watches for changes in deployed dotfiles and automatically
      captures them back to source templates.

      This is useful during active development when you're frequently
      editing dotfiles in your home directory.

      Press Ctrl+C to stop watching.
    dir: "{{.REPO_ROOT}}"
    interactive: true
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-watch-host.sh"
  # Watch for dotfile changes in the repo and auto-regenerate
  watch-repo:
    desc: Watch dotfiles in the repo and auto-regenerate dotfiles
    silent: true
    summary: |
      Watches for changes in dotfile templates and automatically
      regenerates dotfiles when templates change.

      This is useful when developing templates and want to see
      changes immediately.

      Press Ctrl+C to stop watching.
    dir: "{{.REPO_ROOT}}"
    interactive: true
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-watch-repo.sh {{.REPO_ROOT}}"
  # Clean all dotfiles backups
  clean-backups:
    desc: Remove all dotfile backups for current host
    silent: true
    summary: |
      Removes all dotfile backup directories.

      This can free up disk space if you have many old backups.

      ⚠️  This cannot be undone!
    dir: "{{.REPO_ROOT}}"
    prompt: |
      ⚠️  This will delete ALL dotfile backups!

      This cannot be undone.

      Continue?
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/tasks-dotfiles-clean-backups.sh {{.HOST_DIR}}"
