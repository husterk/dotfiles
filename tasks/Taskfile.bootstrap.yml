version: "3"

# ========================================================================
# Bootstrap Tasks
# ========================================================================
# Tasks for bootstrapping and configuring hosts
# ========================================================================

tasks:
  # Generate .env from 1Password
  generate-env:
    desc: "Generate .env file from 1Password secrets"
    silent: true
    summary: |
      Generates .env file from 1Password secrets using template.env.
      Requires 1Password CLI to be authenticated.

      This should be run:
      - When setting up a new host
      - When secrets change in 1Password
      - From the development container (not the host)
    dir: "{{.REPO_ROOT}}"
    preconditions:
      - sh: "op account list &> /dev/null"
        msg: "1Password CLI not authenticated. Run: eval $(op signin)"
      - sh: '[ -f "{{.HOST_DIR}}/template.env" ]'
        msg: "template.env not found: {{.HOST_DIR}}/template.env"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/task-generate-env.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}} {{.HOST_DIR}}"
    sources:
      - "{{.HOST_DIR}}/template.env"
    generates:
      - "{{.HOST_DIR}}/generated/.env"

  # Generate Nix configuration
  generate-nix-config:
    desc: "Generate Nix configuration from template"
    silent: true
    summary: |
      Generates configuration.nix from template with secrets substitution.
      Requires .env file to exist (run generate-env first).

      This should be run:
      - When setting up a new host
      - After modifying configuration-template.nix
      - After modifying host-manifest.yml
      - From the development container (not the host)
    dir: "{{.REPO_ROOT}}"
    deps:
      - generate-env
    preconditions:
      - sh: '[ -f "{{.HOST_DIR}}/configuration-template.nix" ]'
        msg: "configuration-template.nix not found"
      - sh: '[ -f "{{.HOST_DIR}}/generated/.env" ]'
        msg: ".env not found. Run: task bootstrap:generate-env"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/task-generate-nix-config.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}} {{.HOST_DIR}}"
    sources:
      - "{{.HOST_DIR}}/configuration-template.nix"
      - "{{.HOST_DIR}}/host-manifest.yml"
      - "{{.HOST_DIR}}/generated/.env"
    generates:
      - "{{.HOST_DIR}}/generated/configuration.nix"

  # Generate dotfiles
  generate-dotfiles:
    desc: "Generate dotfiles from templates"
    silent: true
    summary: |
      Generates dotfiles from app templates with secrets substitution.
      Requires .env file to exist (run generate-env first).

      This should be run:
      - When setting up a new host
      - After modifying dotfile templates
      - After modifying host-manifest.yml
      - From the development container (not the host)
    dir: "{{.REPO_ROOT}}"
    deps:
      - generate-env
    preconditions:
      - sh: '[ -f "{{.HOST_DIR}}/generated/.env" ]'
        msg: ".env not found. Run: task bootstrap:generate-env"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/task-generate-dotfiles.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}} {{.HOST_DIR}}"
    sources:
      - "{{.HOST_DIR}}/host-manifest.yml"
      - "{{.HOST_DIR}}/generated/.env"
      - "apps/**/dotfiles/**/*"
    generates:
      - "{{.HOST_DIR}}/generated/dotfiles/**/*"

  # Generate all configurations
  generate-all:
    desc: "Generate all configurations (env + nix + dotfiles)"
    silent: true
    summary: |
      Convenience task to generate all configuration files:
      1. .env from 1Password
      2. configuration.nix from template
      3. dotfiles from templates

      This is typically run from the development container.
    cmds:
      - task: generate-env
      - task: generate-nix-config
      - task: generate-dotfiles
      - echo "✅ All configurations generated successfully"

  # Apply Nix configuration
  apply-config:
    desc: "Apply Nix configuration to system"
    silent: true
    summary: |
      Applies the generated Nix configuration using darwin-rebuild.

      This will:
      - Install/update packages defined in configuration
      - Apply system settings
      - Restart services if needed

      Requires:
      - nix-darwin to be installed (run bootstrap first)
      - sudo password
      - To be run on the host machine (not in dev container)
    dir: "{{.REPO_ROOT}}"
    preconditions:
      - sh: "command -v darwin-rebuild &> /dev/null"
        msg: "darwin-rebuild not found. Run: task bootstrap:bootstrap-host"
      - sh: '[ -f "{{.HOST_DIR}}/flake.nix" ]'
        msg: "flake.nix not found in host directory"
      - sh: '[ -f "{{.HOST_DIR}}/generated/configuration.nix" ]'
        msg: "configuration.nix not found. Run: task bootstrap:generate-nix-config"
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/task-apply-config.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}}"

  # Unbootstrap
  unbootstrap:
    desc: "Remove Nix and nix-darwin from system"
    silent: true
    summary: |
      Completely removes Nix and nix-darwin from the system.

      ⚠️  WARNING: This is destructive!

      This will:
      - Remove all Nix-installed packages
      - Remove nix-darwin
      - Remove Nix package manager
      - Clean up system modifications

      Make sure to restore dotfiles first if needed.
    dir: "{{.REPO_ROOT}}"
    prompt: |
      ⚠️  WARNING: This will completely remove Nix and nix-darwin!

      This is a destructive operation. All Nix-installed packages will be removed.

      Have you restored your dotfiles? (task dotfiles:restore)

      Are you absolutely sure you want to continue?
    cmds:
      - "{{.TASKFILE_DIR}}/scripts/task-unbootstrap.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}}"
