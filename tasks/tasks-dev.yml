version: "3"
# ========================================================================
# Development Tasks
# ========================================================================
# Tasks for development workflow and maintenance
# ========================================================================
tasks:
  # Clean generated files
  clean:
    desc: Clean generated files for current host
    silent: true
    summary: |
      Removes generated files:
      - .env (contains secrets!)
      - configuration.nix
      - dotfiles/

      Note: Dotfiles backups are preserved.

      ⚠️  Use with caution! This removes secrets from .env.
    dir: '{{.REPO_ROOT}}'
    prompt: |
      ⚠️  This will delete generated files including .env (which contains secrets).

      Files to be deleted:
      - {{.HOST_DIR}}/generated/.env
      - {{.HOST_DIR}}/generated/configuration.nix
      - {{.HOST_DIR}}/generated/dotfiles/

      Note: Dotfiles backups are preserved.

      Continue?
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-dev-clean.sh {{.HOST_DIR}}'
  # List available hosts
  list-hosts:
    desc: List all available hosts
    silent: true
    summary: |
      Shows all configured hosts in the repository.
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-dev-list-hosts.sh {{.REPO_ROOT}} {{.HOSTNAME}}'
  # Validate configuration
  validate-host-config:
    desc: Validate host configuration and manifests
    silent: true
    summary: |
      Validates host configuration files:
      - Checks YAML syntax in host-manifest.yml
      - Validates template.env exists
      - Checks for required files
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-dev-validate-host-config.sh {{.HOST_DIR}} {{.HOSTNAME}}'
  # Show current host configuration
  show-host-config:
    desc: Show current host configuration
    silent: true
    summary: |
      Displays current host configuration:
      - Hostname
      - Bootstrap target
      - Repository root
      - Environment variables from .env
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-dev-show-host-config.sh {{.HOST_DIR}} {{.HOSTNAME}} {{.BOOTSTRAP_TARGET}} {{.REPO_ROOT}}'
  # Format all code
  format:
    desc: Format all code (shell + Nix + YAML + JSON)
    silent: true
    summary: |
      Formats all files using treefmt.

      treefmt runs all formatters in parallel and only formats files that have changed:
      - shfmt on shell scripts
      - nixpkgs-fmt on Nix files
      - yq on YAML files
      - jq on JSON files

      Configuration: treefmt.toml
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-dev-format.sh {{.REPO_ROOT}}'
  # Lint all code
  lint:
    desc: Lint all code (shell scripts + Nix files)
    silent: true
    summary: |
      Runs all linters on the repository:
      - shellcheck on shell scripts
      - statix on Nix files
    dir: '{{.REPO_ROOT}}'
    cmds:
      - task: lint-scripts
      - task: lint-nix
  # Lint shell scripts
  lint-scripts:
    desc: Lint shell scripts with shellcheck
    silent: true
    internal: true
    summary: |
      Runs shellcheck on all shell scripts in the repository.
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-dev-lint-scripts.sh {{.REPO_ROOT}}'
  # Lint Nix files
  lint-nix:
    desc: Lint Nix files with statix
    silent: true
    internal: true
    summary: |
      Runs statix static analysis on all Nix files in the repository.
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/tasks-dev-lint-nix.sh {{.REPO_ROOT}}'
