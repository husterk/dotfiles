version: "3"
# ========================================================================
# Dotfiles Management Tasks
# ========================================================================
# Tasks for deploying, capturing, and managing dotfiles
# ========================================================================
tasks:
  # Deploy dotfiles
  deploy:
    desc: Deploy dotfiles using GNU Stow
    silent: true
    summary: |
      Deploys dotfiles to home directory using GNU Stow.
      Creates symlinks from generated dotfiles to their target locations.

      This should be run:
      - After generating dotfiles
      - After applying Nix configuration (which installs Stow)
      - On the host machine

      Dotfiles are backed up automatically before deployment.
    dir: '{{.REPO_ROOT}}'
    preconditions:
      - sh: command -v stow &> /dev/null
        msg: 'GNU Stow not found. Run: task bootstrap:apply-config'
      - sh: '[ -d "{{.HOST_DIR}}/generated/dotfiles" ]'
        msg: 'Dotfiles not found. Run: task bootstrap:generate-dotfiles'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/task-deploy-dotfiles.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}}'
  # Redeploy dotfiles (unstow + stow)
  redeploy:
    desc: Redeploy dotfiles (remove and reinstall symlinks)
    silent: true
    summary: |
      Removes existing dotfile symlinks and redeploys them.

      Use this when:
      - Dotfiles were regenerated
      - You want to refresh all symlinks
      - Symlinks may be in an inconsistent state
    dir: '{{.REPO_ROOT}}'
    preconditions:
      - sh: command -v stow &> /dev/null
        msg: 'GNU Stow not found. Run: task bootstrap:apply-config'
      - sh: '[ -d "{{.HOST_DIR}}/generated/dotfiles" ]'
        msg: 'Dotfiles not found. Run: task bootstrap:generate-dotfiles'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/task-redeploy-dotfiles.sh {{.HOST_DIR}}'
  # Capture dotfiles back to source
  capture:
    desc: Capture dotfiles back to source templates
    silent: true
    summary: |
      Captures changes from deployed dotfiles back to source templates.
      Replaces secrets with template variables.

      This should be run:
      - After editing dotfiles in your home directory
      - From the development container
      - With --dry-run first to preview changes

      Usage:
        task dotfiles:capture              # Actually capture
        task dotfiles:capture -- --dry-run # Preview only
    dir: '{{.REPO_ROOT}}'
    preconditions:
      - sh: '[ -d "{{.HOST_DIR}}/generated/dotfiles" ]'
        msg: 'Dotfiles not found. Run: task bootstrap:generate-dotfiles'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/task-capture-dotfiles.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}} {{.CLI_ARGS}}'
  # Restore dotfiles from backup
  restore:
    desc: Restore dotfiles from backup
    silent: true
    summary: |
      Restores dotfiles from the most recent backup.
      Removes Stow symlinks and restores original files.

      Use this:
      - Before unbootstrapping
      - If you want to revert to pre-Stow state
      - If dotfiles are in a broken state
    dir: '{{.REPO_ROOT}}'
    prompt: |
      ⚠️  This will restore dotfiles from backup and remove symlinks.

      Your current symlinked dotfiles will be replaced with backup copies.

      Continue?
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/task-restore-dotfiles.sh {{.BOOTSTRAP_SCRIPTS_DIR}} {{.HOSTNAME}}'
  # Show dotfile status
  status:
    desc: Show dotfile deployment status
    silent: true
    summary: |
      Shows information about deployed dotfiles:
      - Which files are symlinked
      - Backup status
      - Stow package info
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/dotfiles-status.sh {{.HOST_DIR}}'
  # Diff dotfiles
  diff:
    desc: Show differences between source and deployed dotfiles
    silent: true
    summary: |
      Compares source dotfiles with currently deployed versions.
      Useful for seeing what changes you've made.
      Respects .gitignore files in app dotfiles directories.
    dir: '{{.REPO_ROOT}}'
    cmds:
      - '{{.TASKFILE_DIR}}/scripts/dotfiles-diff.sh {{.HOST_DIR}} {{.REPO_ROOT}}'
